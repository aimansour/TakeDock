name: Validate
on:
  push:
    branches: [main, 'Nova/**']
  pull_request:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: '2'
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  ui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: {node-version: '24.21.0', cache: npm}
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:ui
      - run: npm run build
      - run: node --test scripts/release-gate.test.mjs scripts/prepare-publication.test.mjs tests/desktop/tooling.test.mjs
  observer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platforms;android-37.0 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Restore persistent release signing material
        if: inputs.signed == true
        shell: bash
        env:
          KEYSTORE: ${{ secrets.OBSERVER_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/observer.jks"
          chmod 600 "$RUNNER_TEMP/observer.jks"
      - name: Test, lint and build Observer
        shell: pwsh
        env:
          SIGN_CANDIDATE: ${{ inputs.signed }}
          OBSERVER_STORE_PASSWORD: ${{ secrets.OBSERVER_STORE_PASSWORD }}
          OBSERVER_KEY_PASSWORD: ${{ secrets.OBSERVER_KEY_PASSWORD }}
          OBSERVER_KEY_ALIAS: takedock-observer
        run: |
          if($env:SIGN_CANDIDATE -eq 'true') {
            $env:OBSERVER_KEYSTORE=Join-Path $env:RUNNER_TEMP 'observer.jks'
            ./scripts/build-observer.ps1 -Configuration Release
            ./scripts/check-observer-signature.ps1
          } else {./scripts/build-observer.ps1 -Configuration Debug}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: observer, path: src-tauri/resources/observer.apk, if-no-files-found: error}
  desktop:
    needs: observer
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0', cache: npm}
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: observer, path: src-tauri/resources}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'ndk;30.0.16248370'
          log-accepted-android-sdk-licenses: false
      - name: Set up locked toolchain and helper SDK
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt --component clippy --target aarch64-linux-android --target x86_64-linux-android --target armv7-linux-androideabi
          if($LASTEXITCODE -ne 0){throw 'Rust setup failed'}
          ./scripts/build-file-helper.ps1 -NdkRoot "$env:ANDROID_HOME/ndk/30.0.16248370"
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace --all-targets --features desktop --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: npm run desktop:build -- --no-bundle
      - run: ./scripts/check-updater.ps1
      - name: Four mandatory real release Desktop E2E cases
        run: |
          ./scripts/setup-desktop-drivers.ps1
          npm run test:desktop
          if($LASTEXITCODE -ne 0){throw 'Desktop E2E failed'}
      - name: Package tested binary without changing it
        if: inputs.signed == true
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node node_modules/@tauri-apps/cli/tauri.js bundle --features desktop --bundles nsis --no-binary-patching --ci
          if($LASTEXITCODE -ne 0){throw 'Packaging failed'}
          ./scripts/verify-release.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-acceptance
          path: test-results/desktop/acceptance.json
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.signed == true
        with: {name: release-candidate, path: test-results/release, if-no-files-found: error}
  quality-gate:
    if: always()
    needs: [rust, ui, observer, desktop]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with: {node-version: '24.21.0'}
      - name: Reject failed, cancelled, skipped or missing gates
        env:
          RUST_RESULT: ${{ needs.rust.result }}
          UI_RESULT: ${{ needs.ui.result }}
          OBSERVER_RESULT: ${{ needs.observer.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: node scripts/release-gate.mjs "$RUST_RESULT" "$UI_RESULT" "$OBSERVER_RESULT" "$DESKTOP_RESULT"
