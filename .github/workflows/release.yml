name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: takedock-releases
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with: {signed: true}
    secrets: inherit
  publish:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v') && needs.validate.result == 'success' && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: {node-version: '26.12.0'}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: release-candidate, path: release}
      - name: Check exact version and reject a stale release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/prepare-publication.mjs
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --title "TakeDock $RELEASE_TAG" --generate-notes --draft
          node scripts/confirm-release-upload.mjs
          gh release edit "$RELEASE_TAG" --draft=false --latest
