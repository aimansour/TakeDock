version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: {interval: weekly}
    groups: {frontend: {patterns: ['*']}}
  - package-ecosystem: cargo
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gradle
    directory: /observer
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
