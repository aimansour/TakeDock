[package]
name = "takedock"
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Accessible Open Camera control and Android video management"

[lib]
name = "takedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "takedock"
path = "src/main.rs"
required-features = ["desktop"]

[[example]]
name = "updater-validation"
required-features = ["desktop"]

[features]
default = []
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-single-instance"]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1.26", features = ["v4"] }
sha2 = "0.11"
takedock-files = { path = "../file-helper" }
tauri = { version = "=2.12.1", optional = true , features = [] }
tauri-plugin-dialog = {version = "=2.8.0", optional = true}
tauri-plugin-updater = {version = "=2.13.1",optional = true}
tauri-plugin-single-instance = {version = "=2.5.2",optional = true}

[build-dependencies]
tauri-build = {version = "=2.7.1", optional = true, features = [] }

[dev-dependencies]
minisign-verify = "=0.3.0"
base64 = "0.22"
