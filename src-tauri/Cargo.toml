[package]
name = "takedock"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Accessible Open Camera control and Android video management"

[lib]
name = "takedock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "takedock"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = []
desktop = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3.27"
uuid = { version = "1.26", features = ["v4"] }
sha2 = "0.11"

[dev-dependencies]
