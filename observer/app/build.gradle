plugins { id 'com.android.application' }
android {
    namespace = 'app.takedock.observer'
    compileSdk = 37
    defaultConfig {
        applicationId = 'app.takedock.observer'
        minSdk = 36
        targetSdk = 37
        versionCode = 1
        versionName = '0.1.0'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (System.getenv('OBSERVER_KEYSTORE')) {
                storeFile = file(System.getenv('OBSERVER_KEYSTORE'))
                storePassword = System.getenv('OBSERVER_STORE_PASSWORD')
                keyAlias = System.getenv('OBSERVER_KEY_ALIAS')
                keyPassword = System.getenv('OBSERVER_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig = signingConfigs.release; minifyEnabled = false } }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
